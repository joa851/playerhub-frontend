<ion-content class="ion-padding">
  <img class="brand-logo" src="assets/icon.png" alt="PlayerHub" />

  <div class="auth-card">
    <h2 style="text-align:center; margin: 0 0 24px">Crear cuenta</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-list lines="full">
        <ion-item>
          <ion-input
            formControlName="email"
            type="email"
            label="Email"
            labelPlacement="floating"
            autocomplete="email">
          </ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            formControlName="password"
            type="password"
            label="Contraseña (mín. 6 caracteres)"
            labelPlacement="floating"
            autocomplete="new-password">
          </ion-input>
        </ion-item>
      </ion-list>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="ion-margin-top">
        <ion-spinner *ngIf="isLoading()" name="dots"></ion-spinner>
        <span *ngIf="!isLoading()">Registrarme</span>
      </ion-button>

      <p *ngIf="errorMessage()" style="color: var(--ion-color-danger); text-align: center" class="ion-margin-top">
        {{ errorMessage() }}
      </p>

      <p class="ion-margin-top" style="text-align: center; color: #6b7280">
        ¿Ya tienes cuenta? <a [routerLink]="['/auth/login']" style="color: var(--ion-color-primary); font-weight: 600">Inicia sesión</a>
      </p>
    </form>
  </div>
</ion-content>
