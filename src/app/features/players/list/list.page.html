<ion-header>
  <ion-toolbar>
    <ion-title>Players</ion-title>

    <ion-buttons slot="end">
      <ion-button [routerLink]="['/players/ideal-team']" fill="clear" title="Equipo Ideal (LLM)">
        <ion-icon slot="icon-only" name="sparkles-outline"></ion-icon>
      </ion-button>

      <ion-button *ngIf="isAuthenticated()" [routerLink]="['/players/new']" fill="clear">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>

      <ion-button *ngIf="isAuthenticated()" (click)="logout()" fill="clear">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>

      <ion-button *ngIf="!isAuthenticated()" [routerLink]="['/auth/login']" fill="clear">
        <ion-icon slot="icon-only" name="log-in-outline"></ion-icon>
      </ion-button>

      <ion-button *ngIf="!isAuthenticated()" [routerLink]="['/auth/register']" fill="clear">
        <ion-icon slot="icon-only" name="person-add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <app-backend-toggle></app-backend-toggle>
  </ion-toolbar>

  <ion-toolbar>
    <ion-searchbar
      placeholder="Buscar por nombre"
      [debounce]="400"
      [value]="searchTerm()"
      (ionInput)="onSearch($event)">
    </ion-searchbar>
  </ion-toolbar>

</ion-header>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="isLoading()"></ion-spinner>

  <ion-list *ngIf="!isLoading()" lines="none">
    <ion-item
      *ngFor="let p of players()"
      class="player-card"
      button
      detail="false"
      [routerLink]="['/players', p._id]">

      <!-- Avatar: foto o iniciales -->
      <div
        slot="start"
        class="player-avatar"
        [style.backgroundImage]="p.photo ? 'url(' + p.photo + ')' : ''">
        <span *ngIf="!p.photo">{{ (p.name || '?').charAt(0) }}</span>
      </div>

      <ion-label>
        <h2 style="font-size: 17px; font-weight: 600; margin: 0">{{ p.name }}</h2>
        <p *ngIf="p.team || p.league" style="color: #6b7280; margin: 2px 0 0">
          {{ p.team }}<span *ngIf="p.team && p.league"> · </span>{{ p.league }}
        </p>
      </ion-label>

      <span
        *ngIf="p.position"
        slot="end"
        class="position-badge"
        [ngClass]="'position-badge--' + p.position">
        {{ p.position }}
      </span>

      <ion-button
        *ngIf="isAdmin()"
        slot="end"
        fill="clear"
        color="danger"
        (click)="deletePlayer(p, $event)">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <p
    *ngIf="!isLoading() && players().length === 0"
    style="text-align: center; color: #6b7280; margin-top: 64px">
    No hay jugadores.
  </p>
</ion-content>
